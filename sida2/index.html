<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR</title>
  <style>
    body {
      margin: 0;
      padding: 40px;
      box-sizing: border-box;
      min-height: 100vh;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    p {
      max-width: 900px;
      font-size: 32px;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <p>
    Ni får inte lämna rummet innan ni hittat en QR-kod som säger att ni måste lämna rummet.
    <br><br>
    Laget får inte scanna en ny QR-kod innan ni tillsammans genomfört följande test:
    <br><br>
    Bilda en mänsklig pyramid och framför en för dagen ny heja-ramsa. Heja-ramsan måste vara minst 60 sekunder lång.
  </p>
</body>
